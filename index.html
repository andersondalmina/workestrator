<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' ws:"
    />
    <title>Workestrator</title>
  </head>
  <body>
    <script>
      // Applied before the stylesheet paints, so the window never flashes the
      // wrong theme while React is still starting up.
      (function () {
        var theme = localStorage.getItem("workestrator:theme");
        document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
