name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Report every failing check on a pull request, not just the first one.
      fail-fast: false
      matrix:
        include:
          - name: format
            command: npm run format:check
          - name: lint
            command: npm run lint
          - name: typecheck
            command: npm run typecheck
          - name: test
            command: npm test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite, which the app stores its data with, needs Node 22+.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: ${{ matrix.command }}
