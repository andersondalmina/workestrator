name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Report every failing check on a pull request, not just the first one.
      fail-fast: false
      matrix:
        include:
          - name: format
            command: npm run format:check
          - name: lint
            command: npm run lint
          - name: typecheck
            command: npm run typecheck
          - name: test
            command: npm test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # One Node version for CI and for humans. node:sqlite, which the app
          # stores its data with, needs 22+; .nvmrc pins which 22+ it is.
          node-version-file: .nvmrc
          cache: npm

      # npm 10 and npm 11 resolve optional peer dependencies differently, and
      # this tree has one: vitest brings its own vite, whose optional `esbuild`
      # peer is not satisfied by the copy vite 5 hoists. A lockfile written by
      # one major is rejected by the other, so pin the major rather than
      # inherit whatever the Node release happened to bundle.
      - run: npm install -g npm@11

      - run: node -v && npm -v

      - run: npm ci

      - run: ${{ matrix.command }}
